id = "worklouder.micro"
name = "Work Louder Creator Micro 2"
version = "0.1.0"
min_herdr_version = "0.7.3"
description = "Drive the Creator Micro 2 underglow from Herdr agent status and jump to agents from the top six keys"
platforms = ["macos", "linux", "windows"]

[[build]]
command = ["npm", "install", "--omit=dev"]

# Long-running bridge. Open it in a pane to watch what it is doing; for
# everyday use run it in the background (see README).
[[panes]]
id = "leds"
title = "Creator Micro 2 status light"
placement = "overlay"
command = ["node", "bin/leds.js"]

[[actions]]
id = "focus1"
title = "Focus agent 1"
contexts = ["global"]
command = ["node", "bin/focus.js", "1"]

[[actions]]
id = "focus2"
title = "Focus agent 2"
contexts = ["global"]
command = ["node", "bin/focus.js", "2"]

[[actions]]
id = "focus3"
title = "Focus agent 3"
contexts = ["global"]
command = ["node", "bin/focus.js", "3"]

[[actions]]
id = "focus4"
title = "Focus agent 4"
contexts = ["global"]
command = ["node", "bin/focus.js", "4"]

[[actions]]
id = "focus5"
title = "Focus agent 5"
contexts = ["global"]
command = ["node", "bin/focus.js", "5"]

[[actions]]
id = "focus6"
title = "Focus agent 6"
contexts = ["global"]
command = ["node", "bin/focus.js", "6"]
